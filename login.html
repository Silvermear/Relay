<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Relay - Giriş</title>
  <link rel="stylesheet" href="login-style.css">
</head>
<body>

  <div class="login-container">

    <div class="login-box">
      <h1 class="logo">Relay</h1>

      <div class="form-tabs">
        <div class="form-tab active" data-form="register">Kayıt Ol</div>
        <div class="form-tab" data-form="login">Giriş Yap</div>
      </div>

      <!-- Kayıt Ol Formu -->
      <div class="form-panel active" id="form-register">
        <input type="text" id="register-username" placeholder="Kullanıcı adı" class="login-input">
        <input type="email" id="register-email" placeholder="E-posta" class="login-input">
        <input type="password" id="register-password" placeholder="Şifre (en az 6 karakter)" class="login-input">
        <button id="register-btn" class="login-btn">Kayıt Ol</button>
        <div class="message" id="register-message"></div>
      </div>

      <!-- Giriş Yap Formu -->
      <div class="form-panel" id="form-login">
        <input type="email" id="login-email" placeholder="E-posta" class="login-input">
        <input type="password" id="login-password" placeholder="Şifre" class="login-input">
        <button id="login-btn" class="login-btn">Giriş Yap</button>
        <div class="message" id="login-message"></div>
      </div>

      <!-- Kod Doğrulama Formu -->
      <div class="form-panel" id="form-verify">
        <p class="verify-text">E-postana gönderdiğimiz doğrulama kodunu gir:</p>
        <input type="text" id="verify-code" placeholder="12345678" class="login-input" maxlength="8">
        <button id="verify-btn" class="login-btn">Kodu Doğrula</button>
        <div class="message" id="verify-message"></div>
      </div>

    </div>

  </div>

  <script src="auth.js"></script>
</body>
</html>
